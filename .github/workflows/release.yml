name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build app image (jlink + jpackage)
        shell: bash
        run: bash packaging/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.platform }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  jar:
    name: Package portable JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          mvn -B -Drevision="${GITHUB_REF_NAME#v}" verify
          cd target && sha256sum overlook.jar > overlook.jar.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/overlook.jar
            target/overlook.jar.sha256
